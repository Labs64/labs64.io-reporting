<text x="64" y="100" class="sans" font-size="13" font-weight="500" fill="#F08B53" letter-spacing="3.6">LABS64.IO  ·  REPORTING</text>
<text x="64" y="156" class="sans" font-size="48" font-weight="700" fill="#F8EDE5" letter-spacing="-1.4">One store. Many customers.</text>
<text x="64" y="212" class="sans" font-size="48" font-weight="700" fill="#E14817" letter-spacing="-1.4">Each sees only its own rows.</text>
<text x="1136" y="212" class="mono" font-size="14" fill="#F8EDE5" fill-opacity="0.6" text-anchor="end">catalogue  ·  scope filter  ·  row policy</text>
