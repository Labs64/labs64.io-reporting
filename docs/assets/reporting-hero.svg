<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Labs64.IO Reporting</title>
<desc id="d">One ClickHouse table holds the rows of many customers. The same calls metric, requested for acme and then globex, shows each customer its own rows and its own numbers while every other row stays masked; metrics come from a reviewed catalogue, never from SQL.</desc>
